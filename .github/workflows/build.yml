name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generic sanity check -- fastest SDK image, catches anything
          # arch-independent (UCI parsing, protocol logic, the LuCI JS
          # view/rpcd script).
          #
          # Pinned to 24.10.x (not the latest stable, 25.12.x): 24.10
          # still defaults to opkg/.ipk -- 25.12 switched to apk/.apk,
          # which is what the real deploy target below actually runs,
          # confirmed via config/Config-build.in@v24.10.4, where
          # USE_APK is "depends on BROKEN" for this release.
          - arch: x86-64-v24.10.4
            name: x86_64 (sanity check)

          # Matches the actual deploy target this whole pi-relay-control
          # project suite is built for: a Raspberry Pi 3/4-class
          # (Cortex-A53) board, here running OpenWrt 24.10.4 (bcm27xx)
          # instead of Debian/Alpine.
          - arch: aarch64_cortex-a53-v24.10.4
            name: aarch64_cortex-a53 (Pi 3/4-class)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build via OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          # liblgpio must be listed explicitly even though pi-relay-control
          # DEPENDS on it -- it lives in our own feed, not one of the SDK's
          # baked-in default feeds, so it only gets symlinked into
          # package/feeds/ if named here (unlike e.g. a packages-feed lib,
          # which the SDK image already has installed).
          PACKAGES: liblgpio pi-relay-control luci-app-pi-relay-control
          V: s

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: bin/packages/*/action/*.ipk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/*/action/*.ipk
